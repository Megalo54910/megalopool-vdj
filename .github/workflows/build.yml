name: Compilation du plugin

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compiler (x64, Release)
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release
      - name: Préparer le fichier
        shell: bash
        run: mkdir -p dist && cp build/Release/MegaloPool.dll dist/
      - uses: actions/upload-artifact@v4
        with:
          name: MegaloPool-Windows
          path: dist/MegaloPool.dll

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compiler (Apple Silicon + Intel, Release)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15
          cmake --build build
      - name: Signer (ad hoc) et compresser
        run: |
          codesign --force --deep --sign - build/MegaloPool.bundle
          mkdir -p dist
          ditto -c -k --keepParent build/MegaloPool.bundle dist/MegaloPool-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MegaloPool-macOS
          path: dist/MegaloPool-macOS.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MegaloPool-Windows/MegaloPool.dll
            dist/MegaloPool-macOS/MegaloPool-macOS.zip
